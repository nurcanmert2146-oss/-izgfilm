name: izgfilm-otomasyon

on:
  schedule:
    - cron: "0 16 * * *"   # 16:00 UTC = 19:00 TR
  workflow_dispatch: {}     # elle de tetiklenebilir

permissions:
  contents: write           # durum.json'u geri yazabilmek için

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: bağımlılıklar
        run: pip install -r requirements.txt

      - name: üret ve yükle
        env:
          SES_SAGLAYICI: ${{ vars.SES_SAGLAYICI }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GORSEL_API_URL: ${{ secrets.GORSEL_API_URL }}
          GORSEL_API_KEY: ${{ secrets.GORSEL_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python otomasyon.py

      - name: durum.json commit
        run: |
          git config user.name "izgfilm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum.json
          git commit -m "durum güncelle" || echo "değişiklik yok"
          git push || echo "push atlandı"
